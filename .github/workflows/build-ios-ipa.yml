name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'sidestore-source.json'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Saturn app icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/saturn-icon.svg').resize(1024,1024).png().toFile('assets/icon.png')"
      - name: Publish updated icon asset to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Update Saturn app icon"
            git push
          fi
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build app without code signing
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then echo "No Xcode workspace found"; ls -la; exit 1; fi
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const w=Object.values(j).find(v=>v&&v.schemes);if(!w||!w.schemes.length)process.exit(2);console.log(w.schemes[0])})")
          echo "Building Xcode workspace: $WORKSPACE"
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH" && test -d "$APP_PATH" || { echo "Built .app not found"; find ios/build/Build/Products -maxdepth 4 -name '*.app' -print; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Saturn-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-unsigned-IPA
          path: Saturn-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saturn-v1.0.${{ github.run_number }}
          name: Saturn v1.0.${{ github.run_number }}
          body: |
            Unsigned iOS build of Saturn generated by GitHub Actions.
            
            Note: This IPA is unsigned and is not directly installable on a standard iPhone. A signed build requires Apple code signing.
          prerelease: false
          files: Saturn-unsigned.ipa

      - name: Update SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ github.run_number }}
          RELEASE_TAG: saturn-v1.0.${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'sidestore-source.json';
          const feed = JSON.parse(fs.readFileSync(path, 'utf8'));
          const version = '1.0.' + process.env.BUILD_VERSION;
          const downloadURL = 'https://github.com/${{ github.repository }}/releases/download/' + process.env.RELEASE_TAG + '/Saturn-unsigned.ipa';
          const size = fs.statSync('Saturn-unsigned.ipa').size;
          feed.name = 'Saturn';
          feed.subtitle = 'A calmer web browser';
          feed.description = 'Saturn for iPhone and iPad. Updates are published with each GitHub release.';
          feed.iconURL = 'https://raw.githubusercontent.com/${{ github.repository }}/main/assets/icon.png';
          if (!feed.apps || !feed.apps.length) throw new Error('SideStore feed has no app entry');
          const app = feed.apps[0];
          app.name = 'Saturn';
          app.subtitle = 'Browse with a little more calm';
          app.localizedDescription = 'Saturn browser with search, bookmarks, Quick Paths, and daily Bible verses.';
          app.iconURL = feed.iconURL;
          app.versions = app.versions || [];
          app.versions = app.versions.filter(v => v.version !== version);
          app.versions.unshift({
            version,
            buildVersion: String(process.env.BUILD_VERSION),
            date: new Date().toISOString(),
            localizedDescription: 'Saturn browser update.',
            downloadURL,
            size
          });
          fs.writeFileSync(path, JSON.stringify(feed, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git commit -m "Publish Saturn build to SideStore feed"
          git push
