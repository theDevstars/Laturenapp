name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build app without code signing
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme Lantern -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/Lantern.app"
          test -d "$APP_PATH" || { echo "Built .app not found at $APP_PATH"; find ios/build/Build/Products -maxdepth 4 -name '*.app' -print; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lantern-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lantern-unsigned-IPA
          path: Lantern-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
