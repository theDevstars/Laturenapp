name: Build Lantern IPA, APK and EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "app.json"
      - "App.js"
      - "assets/icon.png"
      - "desktop/index.html"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Set native app version for this build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const config=JSON.parse(fs.readFileSync(p,'utf8')); const build=process.env.BUILD_NUMBER; config.expo.version='1.0.'+build; config.expo.ios={...config.expo.ios,buildNumber:build}; config.expo.android={...config.expo.android,versionCode:Number(build)}; fs.writeFileSync(p,JSON.stringify(config,null,2)+'\\n');"
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build iOS app
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme Lantern -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/Lantern.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Lantern-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-unsigned-IPA
          path: Lantern-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Set native app version for this build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const config=JSON.parse(fs.readFileSync(p,'utf8')); const build=process.env.BUILD_NUMBER; config.expo.version='1.0.'+build; config.expo.ios={...config.expo.ios,buildNumber:build}; config.expo.android={...config.expo.android,versionCode:Number(build)}; fs.writeFileSync(p,JSON.stringify(config,null,2)+'\\n');"
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lantern-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Package Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Lantern-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish release with all builds
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-windows]
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Lantern-unsigned-IPA
          path: release-files
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Lantern-APK
          path: release-files
      - name: Download Windows EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Lantern-Windows-EXE
          path: release-files
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lantern-v1.0.${{ github.run_number }}
          name: Lantern v1.0.${{ github.run_number }} - Bible Verse Update
          body: |
            Lantern browser with a DuckDuckGo home screen, optional daily rotating Bible verse, saved pages, and security settings.

            Assets:
            - Android APK: intended for Android devices.
            - Windows EXE installer: Lantern desktop browser with the DuckDuckGo home screen and daily verse settings.
            - iOS IPA: unsigned build; standard iPhone installation requires Apple code signing.
          prerelease: true
          files: release-files/*
      - name: Update SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: lantern-v1.0.${{ github.run_number }}
        run: |
          IPA_SIZE=$(stat -c%s release-files/Lantern-unsigned.ipa)
          node -e "const fs=require('fs'); const build=process.env.BUILD_NUMBER; const tag=process.env.RELEASE_TAG; const source={name:'Lantern',subtitle:'A calmer web browser',description:'Lantern for iPhone and iPad. Updates are published with each GitHub release.',iconURL:'https://raw.githubusercontent.com/theDevstars/Laturenapp/main/assets/icon.png',website:'https://github.com/theDevstars/Laturenapp',tintColor:'#DDAF64',apps:[{name:'Lantern',bundleIdentifier:'com.yourname.lantern',developerName:'theDevstars',subtitle:'Browse with a little more calm',localizedDescription:'Search the web with DuckDuckGo, save pages, and read a rotating daily Bible verse.',iconURL:'https://raw.githubusercontent.com/theDevstars/Laturenapp/main/assets/icon.png',tintColor:'#DDAF64',category:'utilities',versions:[{version:'1.0.'+build,buildVersion:build,date:new Date().toISOString(),localizedDescription:'Lantern browser update.',downloadURL:'https://github.com/theDevstars/Laturenapp/releases/download/'+tag+'/Lantern-unsigned.ipa',size:Number(process.env.IPA_SIZE)}],appPermissions:{entitlements:[],privacy:{NSPhotoLibraryUsageDescription:'Choose a wallpaper for Lantern.'}}}],news:[]};fs.writeFileSync('sidestore-source.json',JSON.stringify(source,null,2)+'\\n');"
          echo "$GH_TOKEN" | gh auth login --with-token
          gh api repos/theDevstars/Laturenapp/contents/sidestore-source.json --method PUT --field message="Update SideStore source for $RELEASE_TAG" --field content="$(base64 -w0 sidestore-source.json)" --field branch=main
